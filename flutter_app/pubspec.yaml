name: pembaca_surat_otomatis
description: Aplikasi Pembaca & Ekstraksi Surat Otomatis berbahasa Indonesia menggunakan Material 3 dan Gemini 2.5 Flash.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.6
  file_picker: ^8.1.2
  syncfusion_flutter_pdfviewer: ^27.1.58
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  flutter_dotenv: ^5.2.1
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
